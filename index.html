<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пищевик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F5EFE4; --card:#FFFFFF; --text:#2B1D14; --muted:#8A7B6C;
    --border:#E4D9C6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;overflow-x:hidden;max-width:100vw;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,Roboto,sans-serif;padding-bottom:90px;}

  header{
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  header img{height:36px;object-fit:contain;}
  #contactsBtn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--text);}

  #contactsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;}
  #contactsOverlay .box{background:#fff;margin:20% 20px 0;border-radius:14px;padding:20px;}
  #contactsOverlay .box p{margin:0 0 8px;font-size:14px;}
  #contactsOverlay .box a{color:#2B1D14;}
  #closeContacts{width:100%;padding:12px;border:none;border-radius:10px;background:#2B1D14;color:#fff;font-size:14px;font-weight:600;margin-top:8px;}

  .search{position:relative;margin:12px 16px;}
  .search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:15px;}
  .search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);}

  .groupgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 8px;}
  .groupcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .groupcard .photo{width:100%;aspect-ratio:1.3;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;}
  .groupcard .photo img{width:100%;height:100%;object-fit:cover;}
  .groupcard .info{padding:10px 12px;}
  .groupcard .gname{font-size:13.5px;font-weight:600;line-height:1.3;margin:0 0 2px;}
  .groupcard .gcount{font-size:11.5px;color:var(--muted);margin:0;}

  .backbar{display:flex;align-items:center;gap:8px;padding:4px 16px 8px;}
  .backbar button{border:none;background:none;font-size:14px;color:var(--text);padding:6px 0;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;}
  .swatch{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .swatch img{width:100%;height:100%;object-fit:cover;}
  .name{font-size:13px;font-weight:500;margin:0 0 2px;line-height:1.3;word-break:break-word;overflow-wrap:break-word;}
  .price{font-size:12px;color:var(--muted);margin:0 0 8px;}
  .stepper{display:flex;align-items:center;justify-content:space-between;}
  .stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:16px;}
  .weight{font-size:13px;font-variant-numeric:tabular-nums;}
  .sub-total{font-size:13px;font-weight:600;margin:6px 0 0;color:var(--muted);}
  .sub-total.active{color:var(--text);}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10;}
  .cartbar .count{font-size:12px;color:var(--muted);margin:0;}
  .cartbar .total{font-size:18px;font-weight:700;margin:2px 0 0;}
  .cartbar button{background:var(--text);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;}
  .empty{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center;}
  .loadmore{grid-column:1/-1;padding:12px;text-align:center;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:13px;color:var(--text);margin-top:4px;}
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Pischevik">
  <button id="contactsBtn" type="button">Контакти</button>
</header>

<div id="contactsOverlay">
  <div class="box">
    <p style="font-size:16px;font-weight:700;">Контакти</p>
    <p>📞 <a href="tel:+380973588077">+38 (097) 358-80-77</a></p>
    <p>📍 49074, м. Дніпро, вул. Батумська 11, оф. 104</p>
    <p style="color:#8A7B6C;font-size:13px;">Пн–Пт: 08:00–16:00, Сб–Нд: вихідний</p>
    <button id="closeContacts" type="button">Закрити</button>
  </div>
</div>

<div class="search">
  <span>🔍</span>
  <input id="search" placeholder="Знайти товар">
</div>

<div id="backbar" class="backbar" style="display:none;">
  <button id="backBtn" type="button">← Всі категорії</button>
</div>

<div class="groupgrid" id="groupgrid"></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" style="display:none;">Нічого не знайдено</p>

<div class="cartbar">
  <div>
    <p class="count" id="cartCount">Кошик порожній</p>
    <p class="total" id="cartTotal">0 ₴</p>
  </div>
  <button id="checkout" type="button">Оформити →</button>
</div>

<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var WEIGHT_STEP = 100;
var PAGE_SIZE = 20;
var DATA = { categories: {}, products: [] };
var state = { view: 'groups', groupIds: null, q: '', qty: {}, shown: PAGE_SIZE };
var searchTimer = null;

var GROUPS = [
  { id:'cocoa', name:'Какао та шоколад', emoji:'🍫', match:['Натуральний шоколад','Какао терте','Какао боби','Какао масло','Какао порошок','Кероб натуральний замінник кави, какао','Глазур Кондитерська'] },
  { id:'nuts', name:'Горіхи та сухофрукти', emoji:'🥜', match:['Горіхи','Сухофрукти та ягоди','Натуральні горіхові пасти','Мигдальне борошно','Кокосове борошно'] },
  { id:'spices', name:'Спеції та ароматизатори', emoji:'🌿', match:['Спеції і прянощі','Ванілін і спеції','Ароматизатори','Харчові барвники'] },
  { id:'sugar', name:'Цукор та підсолоджувачі', emoji:'🍬', match:['Підсолоджувачі синтетичні','Підсолоджувачі натуральні','Кокосовий цукор і тростинний','Мальтодекстрин','Сиропи'] },
  { id:'dairy', name:'Молочні та рослинні альтернативи', emoji:'🥛', match:['Сухе молоко, вершки','Рослинні вершки та молоко','Кокосова олія','Олії рослинні','Масло жожоба','Пропіленгліколь / гліцерин'] },
  { id:'gelling', name:'Желюючі речовини та консерванти', emoji:'🧪', match:['Агар-Агар, Альбумін, Желатин, Пектин','Консерванти харчові','Підсилювачі смаку'] },
  { id:'baking', name:'Кондитерське приладдя', emoji:'🎂', match:['Все для кондитера','Форми пластикові','Кондитерське борошно','Продукти для приготування суші','Подарунковий сертифікат'] },
  { id:'coconut', name:'Кокос, кунжут та суперфуди', emoji:'🥥', match:['Кокосова стружка','Кунжут','Водорості та морська капуста','Суперфуди'] }
];

fetch('products.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    DATA = data;
    DATA.products.forEach(function(p){ state.qty[p.id] = 0; });
    GROUPS.forEach(function(g){
      g.catIds = Object.keys(DATA.categories).filter(function(id){
        return g.match.indexOf(DATA.categories[id]) !== -1;
      });
      var withPhoto = DATA.products.filter(function(p){
        return p.available && g.catIds.indexOf(p.category_id) !== -1 && p.picture;
      });
      g.photo = withPhoto.length ? withPhoto[0].picture : null;
    });
    render();
  });

function groupCounts(){
  var counts = {};
  GROUPS.forEach(function(g){
    counts[g.id] = DATA.products.filter(function(p){
      return p.available && g.catIds.indexOf(p.category_id) !== -1;
    }).length;
  });
  return counts;
}

function render(){
  var isSearching = state.q.trim().length > 0;
  document.getElementById('backbar').style.display = (state.view === 'products' && !isSearching) ? 'flex' : 'none';
  document.getElementById('groupgrid').style.display = (state.view === 'groups' && !isSearching) ? 'grid' : 'none';
  document.getElementById('grid').style.display = (state.view === 'products' || isSearching) ? 'grid' : 'none';

  if (state.view === 'groups' && !isSearching) {
    renderGroupCards();
  } else {
    renderGrid();
  }
  renderCart();
}

function renderGroupCards(){
  var counts = groupCounts();
  var el = document.getElementById('groupgrid');
  el.innerHTML = GROUPS.filter(function(g){ return counts[g.id] > 0; }).map(function(g){
    var img = g.photo ? ('<img src="' + g.photo + '" loading="lazy">') : g.emoji;
    return '<div class="groupcard" data-id="' + g.id + '">' +
      '<div class="photo">' + img + '</div>' +
      '<div class="info">' +
        '<p class="gname">' + g.name + '</p>' +
        '<p class="gcount">' + counts[g.id] + ' товарів</p>' +
      '</div>' +
    '</div>';
  }).join('');
  var cards = el.querySelectorAll('.groupcard');
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener('click', function(){
      var gid = this.getAttribute('data-id');
      var group = GROUPS.filter(function(g){ return g.id === gid; })[0];
      state.view = 'products';
      state.groupIds = group.catIds;
      state.shown = PAGE_SIZE;
      render();
    });
  }
}

function filtered(){
  var q = state.q.trim().toLowerCase();
  if (q) {
    return DATA.products.filter(function(p){ return p.available && p.name.toLowerCase().indexOf(q) !== -1; });
  }
  return DATA.products.filter(function(p){ return p.available && state.groupIds.indexOf(p.category_id) !== -1; });
}

function unitLabel(p){
  return p.unit_type === 'weight' ? 'г' : 'шт';
}

function priceLabel(p){
  if (p.unit_type === 'weight') {
    return p.price_per_100g + ' ₴ / 100 г';
  }
  return p.price + ' ₴ / шт';
}

function calcStep(p){
  return p.unit_type === 'weight' ? WEIGHT_STEP : 1;
}

function calcSum(p, qty){
  if (p.unit_type === 'weight') {
    return (p.price_per_100g * qty / 100);
  }
  return p.price * qty;
}

function renderGrid(){
  var all = filtered();
  var list = all.slice(0, state.shown);
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  empty.style.display = list.length ? 'none' : 'block';
  grid.style.display = list.length ? 'grid' : 'none';

  var html = list.map(function(p){
    var qty = state.qty[p.id];
    var sub = calcSum(p, qty).toFixed(0);
    var img = p.picture ? ('<img src="' + p.picture + '" loading="lazy">') : '📦';
    return '<div class="card">' +
      '<div class="swatch">' + img + '</div>' +
      '<p class="name">' + p.name + '</p>' +
      '<p class="price">' + priceLabel(p) + '</p>' +
      '<div class="stepper">' +
        '<button data-id="' + p.id + '" data-d="-1">−</button>' +
        '<span class="weight">' + qty + ' ' + unitLabel(p) + '</span>' +
        '<button data-id="' + p.id + '" data-d="1">+</button>' +
      '</div>' +
      '<p class="sub-total ' + (qty>0?'active':'') + '">' + sub + ' ₴</p>' +
    '</div>';
  }).join('');

  if (all.length > state.shown) {
    html += '<div class="loadmore" id="loadmoreBtn">Показати ще (' + (all.length - state.shown) + ')</div>';
  }

  grid.innerHTML = html;
  var btns = grid.querySelectorAll('.stepper button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function(){
      var id = this.getAttribute('data-id');
      var d = parseInt(this.getAttribute('data-d'), 10);
      var product = DATA.products.filter(function(p){ return p.id === id; })[0];
      var step = calcStep(product);
      state.qty[id] = Math.max(0, (state.qty[id] || 0) + d * step);
      renderGrid(); renderCart();
    });
  }
  var lm = document.getElementById('loadmoreBtn');
  if (lm) lm.addEventListener('click', function(){ state.shown += PAGE_SIZE; renderGrid(); });
}

function renderCart(){
  var items = DATA.products.filter(function(p){ return state.qty[p.id] > 0; });
  var total = items.reduce(function(s,p){ return s + calcSum(p, state.qty[p.id]); }, 0);
  document.getElementById('cartCount').textContent = items.length ? (items.length + ' товар(и)') : 'Кошик порожній';
  document.getElementById('cartTotal').textContent = total.toFixed(0) + ' ₴';
}

document.getElementById('search').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  var val = e.target.value;
  searchTimer = setTimeout(function(){
    state.q = val; state.shown = PAGE_SIZE; render();
  }, 250);
});

document.getElementById('backBtn').addEventListener('click', function(){
  state.view = 'groups'; state.groupIds = null; render();
});

document.getElementById('contactsBtn').addEventListener('click', function(){
  document.getElementById('contactsOverlay').style.display = 'block';
});
document.getElementById('closeContacts').addEventListener('click', function(){
  document.getElementById('contactsOverlay').style.display = 'none';
});

document.getElementById('checkout').addEventListener('click', function(){
  var items = DATA.products.filter(function(p){ return state.qty[p.id] > 0; });
  if (items.length === 0) { alert('Кошик порожній'); return; }
  var order = {
    source: 'miniapp',
    items: items.map(function(p){
      var qty = state.qty[p.id];
      return { name: p.name, qty: qty, unit: unitLabel(p), sum: +calcSum(p, qty).toFixed(0) };
    }),
    total: items.reduce(function(s,p){ return s + calcSum(p, state.qty[p.id]); }, 0).toFixed(0)
  };
  var payload = JSON.stringify(order);
  if (payload.length > 4000) {
    alert('Забагато товарів у кошику. Зменшіть кількість позицій.');
    return;
  }
  try {
    if (tg) {
      tg.sendData(payload);
    } else {
      alert('Замовлення: ' + payload);
    }
  } catch (e) {
    alert('Помилка відправки: ' + e.message);
  }
});
</script>
</body>
</html>
