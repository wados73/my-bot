<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пищевик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F5EFE4; --card:#FFFFFF; --text:#2B1D14; --muted:#8A7B6C;
    --border:#E4D9C6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Roboto,sans-serif;padding-bottom:90px;}
  header{padding:16px;}
  header p{margin:0;}
  .sub{font-size:13px;color:var(--muted);}
  .title{font-size:19px;font-weight:600;margin-top:2px;}
  .search{position:relative;margin:12px 16px;}
  .search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:15px;}
  .search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);}

  .catlist{padding:0 16px;}
  .catrow{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--border);font-size:14.5px;}
  .catrow .cnt{font-size:12px;color:var(--muted);}
  .catrow .arrow{color:var(--muted);margin-left:8px;}

  .backbar{display:flex;align-items:center;gap:8px;padding:4px 16px 8px;}
  .backbar button{border:none;background:none;font-size:14px;color:var(--text);padding:6px 0;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;}
  .swatch{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .swatch img{width:100%;height:100%;object-fit:cover;}
  .name{font-size:13px;font-weight:600;margin:0 0 2px;line-height:1.3;}
  .price{font-size:12px;color:var(--muted);margin:0 0 8px;}
  .stepper{display:flex;align-items:center;justify-content:space-between;}
  .stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:16px;}
  .weight{font-size:13px;font-variant-numeric:tabular-nums;}
  .sub-total{font-size:13px;font-weight:600;margin:6px 0 0;color:var(--muted);}
  .sub-total.active{color:var(--text);}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
  .cartbar .count{font-size:12px;color:var(--muted);margin:0;}
  .cartbar .total{font-size:18px;font-weight:700;margin:2px 0 0;}
  .cartbar button{background:var(--text);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;}
  .empty{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center;}
  .loadmore{grid-column:1/-1;padding:12px;text-align:center;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:13px;color:var(--text);margin-top:4px;}
</style>
</head>
<body>

<header>
  <p class="sub">Крамниця</p>
  <p class="title">Пищевик</p>
</header>

<div class="search">
  <span>🔍</span>
  <input id="search" placeholder="Знайти товар">
</div>

<div id="backbar" class="backbar" style="display:none;">
  <button id="backBtn">← Всі категорії</button>
</div>

<div class="catlist" id="catlist"></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" style="display:none;">Нічого не знайдено</p>

<div class="cartbar">
  <div>
    <p class="count" id="cartCount">Кошик порожній</p>
    <p class="total" id="cartTotal">0 ₴</p>
  </div>
  <button id="checkout">Оформити →</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const STEP = 100;
const PAGE_SIZE = 20;
let DATA = { categories: {}, products: [] };
const state = { view: 'categories', cat: null, q: '', w: {}, shown: PAGE_SIZE };
let searchTimer = null;

fetch('products.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    DATA.products.forEach(p => state.w[p.id] = 0);
    render();
  });

function catCounts(){
  const counts = {};
  DATA.products.forEach(p => {
    if (!p.available) return;
    counts[p.category_id] = (counts[p.category_id] || 0) + 1;
  });
  return counts;
}

function render(){
  const isSearching = state.q.trim().length > 0;
  document.getElementById('backbar').style.display = (state.view === 'products' && !isSearching) ? 'flex' : 'none';
  document.getElementById('catlist').style.display = (state.view === 'categories' && !isSearching) ? 'block' : 'none';
  document.getElementById('grid').style.display = (state.view === 'products' || isSearching) ? 'grid' : 'none';

  if (state.view === 'categories' && !isSearching) {
    renderCatList();
  } else {
    renderGrid();
  }
  renderCart();
}

function renderCatList(){
  const counts = catCounts();
  const catIds = Object.keys(DATA.categories).filter(id => counts[id]);
  const el = document.getElementById('catlist');
  el.innerHTML = catIds.map(id =>
    `<div class="catrow" data-id="${id}">
      <span>${DATA.categories[id]}</span>
      <span><span class="cnt">${counts[id]}</span><span class="arrow">›</span></span>
    </div>`
  ).join('');
  el.querySelectorAll('.catrow').forEach(row => row.onclick = () => {
    state.view = 'products';
    state.cat = row.dataset.id;
    state.shown = PAGE_SIZE;
    render();
  });
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  if (q) {
    return DATA.products.filter(p => p.available && p.name.toLowerCase().includes(q));
  }
  return DATA.products.filter(p => p.available && p.category_id === state.cat);
}

function renderGrid(){
  const all = filtered();
  const list = all.slice(0, state.shown);
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  empty.style.display = list.length ? 'none' : 'block';
  grid.style.display = list.length ? 'grid' : 'none';

  let html = list.map(p => {
    const w = state.w[p.id];
    const sub = (p.price * w / 100).toFixed(0);
    const img = p.picture ? `<img src="${p.picture}" loading="lazy">` : '📦';
    return `<div class="card">
      <div class="swatch">${img}</div>
      <p class="name">${p.name}</p>
      <p class="price">${p.price} ₴ / 100 г</p>
      <div class="stepper">
        <button data-id="${p.id}" data-d="-1">−</button>
        <span class="weight">${w} г</span>
        <button data-id="${p.id}" data-d="1">+</button>
      </div>
      <p class="sub-total ${w>0?'active':''}">${sub} ₴</p>
    </div>`;
  }).join('');

  if (all.length > state.shown) {
    html += `<div class="loadmore" id="loadmoreBtn">Показати ще (${all.length - state.shown})</div>`;
  }

  grid.innerHTML = html;
  grid.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id, d=+b.dataset.d;
    state.w[id]=Math.max(0,(state.w[id]||0)+d*STEP);
    renderGrid(); renderCart();
  });
  const lm = document.getElementById('loadmoreBtn');
  if (lm) lm.onclick = () => { state.shown += PAGE_SIZE; renderGrid(); };
}

function renderCart(){
  const items = DATA.products.filter(p => state.w[p.id] > 0);
  const total = items.reduce((s,p)=>s+p.price*state.w[p.id]/100,0);
  document.getElementById('cartCount').textContent = items.length ? `${items.length} товар(и)` : 'Кошик порожній';
  document.getElementById('cartTotal').textContent = total.toFixed(0)+' ₴';
}

document.getElementById('search').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(()=>{
    state.q = val; state.shown = PAGE_SIZE; render();
  }, 250);
});

document.getElementById('backBtn').addEventListener('click', ()=>{
  state.view = 'categories'; state.cat = null; render();
});

document.getElementById('checkout').onclick = ()=>{
  const items = DATA.products.filter(p => state.w[p.id] > 0);
  if(!items.length) return;
  const order = {
    source: 'miniapp',
    items: items.map(p=>({name:p.name, weight:state.w[p.id], sum:+(p.price*state.w[p.id]/100).toFixed(0)})),
    total: items.reduce((s,p)=>s+p.price*state.w[p.id]/100,0).toFixed(0)
  };
  if(tg){ tg.sendData(JSON.stringify(order)); }
  else alert('Замовлення: '+JSON.stringify(order,null,2));
};
</script>
</body>
</html>
